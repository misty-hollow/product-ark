services:
  postgres:
    image: postgres:16-alpine
    container_name: earth-item-archive-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: earth_archive
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
